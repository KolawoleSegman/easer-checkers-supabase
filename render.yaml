# Render Blueprint — deploy both services at once via
# Render Dashboard → New → Blueprint → select this repo.
#
# IMPORTANT — read before deploying:
# The database now lives in Supabase (Postgres), so accounts, games and
# stats survive every Render deploy/restart — even on the free plan.
# You must paste your Supabase connection string into the DATABASE_URL env
# var in the Render dashboard (see SUPABASE_SETUP.md).
# Still true on Render Free: uploaded avatars live on the ephemeral
# filesystem and are lost on restart, and the backend sleeps after 15 min
# idle (cold start ~30-60s).

services:
  # ---- Backend: NestJS API + Socket.IO ----
  - type: web
    name: easer-checker-backend
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start:prod
    autoDeploy: true
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://easer-checker-frontend.onrender.com
      # Supabase → Connect → "Session pooler" connection string (IPv4-safe).
      - key: DATABASE_URL
        sync: false
      - key: DATA_DIR
        value: /var/data
    # Optional: a paid plan + this disk also keeps uploaded avatars.
    # disk:
    #   name: easer-checker-data
    #   mountPath: /var/data
    #   sizeGB: 1

  # ---- Frontend: static React app ----
  - type: web
    name: easer-checker-frontend
    runtime: static
    rootDir: client
    # Render doesn't interpolate variables inside render.yaml itself, so
    # BACKEND_HOST is resolved as a real env var and interpolated by the
    # shell here at build time — that's how VITE_API_URL gets baked into
    # the production build.
    buildCommand: npm install && VITE_API_URL="https://${BACKEND_HOST}" npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: BACKEND_HOST
        fromService:
          type: web
          name: easer-checker-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
